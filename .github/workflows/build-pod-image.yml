# Builds the pod image and publishes it to GitHub's registry (ghcr.io), so nobody needs Docker
# on their own PC. Runs when a file that goes into the image changes on main, or by hand from
# the Actions tab ("Run workflow").
name: build-pod-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, start.sh, "config/**", "scripts/**", .dockerignore, .github/workflows/build-pod-image.yml]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the image is about 10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Image name (the registry wants lower case)
        id: name
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: IMAGE_VERSION=${{ github.sha }}
          # "latest" moves with main; the commit tag never moves, so a template can stay on one build.
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
